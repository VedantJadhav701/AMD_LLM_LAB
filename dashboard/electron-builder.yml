appId: com.vedantjadhav.amdllmlab
productName: AMD LLM Lab
directories:
  output: release
files:
  - ".next/**/*"
  - "dist-electron/**/*"
  - "package.json"
  - "node_modules/next/**/*"
  - "node_modules/react/**/*"
  - "node_modules/react-dom/**/*"
  - "node_modules/scheduler/**/*"
  - "node_modules/lucide-react/**/*"
  - "node_modules/recharts/**/*"
  - "public/**/*"
extraResources:
  - from: "../backend"
    to: "backend"
    filter:
      - "**/*"
      - "!__pycache__"
      - "!.venv"
win:
  target: nsis
mac:
  category: public.app-category.developer-tools
  target: dmg
