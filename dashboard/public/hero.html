<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Design World — Explore New Ideas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <style>
    :root {
      --bg: #f8f6f0;
      --fg: #111111;
      --text-subtle: #777777;
      --card-bg: rgba(0, 0, 0, 0.04);
      --border-line: rgba(17, 17, 17, 0.85);
      --pad-x: clamp(20px, 6.95vw, 120px);
    }

    [data-theme="dark"] {
      --bg: #000000;
      --fg: #ffffff;
      --text-subtle: #888888;
      --card-bg: rgba(255, 255, 255, 0.08);
      --border-line: rgba(255, 255, 255, 0.85);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Poppins', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      transition: background-color 0.4s ease, color 0.4s ease;
    }

    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100svh;
      min-height: 520px;
      overflow: hidden;
      background: var(--bg);
      transition: background-color 0.4s ease;
    }

    #scene {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: grab;
      touch-action: none;
    }

    #scene.dragging {
      cursor: grabbing;
    }

    .ui {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    .ui a, .ui button {
      pointer-events: auto;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    /* NAV */
    .nav {
      position: absolute;
      top: clamp(24px, 4.7vh, 40px);
      left: var(--pad-x);
      right: var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--fg);
      text-decoration: none;
      font-size: 15px;
      letter-spacing: -0.01em;
      transition: color 0.3s;
    }

    .logo-mark {
      width: 20px;
      height: 40px;
      background: var(--fg);
      border-radius: 0 20px 20px 0;
      transition: background-color 0.3s;
    }

    .logo b {
      font-weight: 700;
    }

    .logo span {
      font-weight: 400;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: clamp(16px, 3vw, 40px);
    }

    .nav-links {
      display: flex;
      gap: clamp(20px, 4.1vw, 60px);
      list-style: none;
    }

    .nav-links a {
      color: var(--fg);
      text-decoration: none;
      font-size: 15px;
      font-weight: 500;
      position: relative;
      cursor: pointer;
      transition: color 0.3s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: -4px;
      height: 1px;
      background: currentColor;
      transform: scaleX(0);
      transform-origin: right;
      transition: transform 0.35s ease;
    }

    .nav-links a:hover::after {
      transform: scaleX(1);
      transform-origin: left;
    }

    /* Theme Toggle */
    .theme-toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 12px;
      border: 1.5px solid var(--fg);
      border-radius: 16px;
      background: transparent;
      color: var(--fg);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .theme-toggle:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .theme-toggle svg {
      width: 14px;
      height: 14px;
    }

    /* ARROWS */
    .arrows {
      position: absolute;
      top: 18.9%;
      left: 76.7%;
      display: flex;
      gap: 32px;
      transform: translate(-19px, -50%);
    }

    .arrow {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 2.5px solid var(--fg);
      background: transparent;
      color: var(--fg);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.3s;
    }

    .arrow svg {
      width: 18px;
      height: 18px;
    }

    .arrow:hover {
      background: var(--fg);
      color: var(--bg);
    }

    /* PAGINATION DOTS */
    .dots {
      position: absolute;
      right: calc(var(--pad-x) - 7px);
      top: 49.4%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 33px;
    }

    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--fg);
      background: var(--fg);
      cursor: pointer;
      transition: background 0.25s, border-color 0.3s;
    }

    .dot.active {
      background: transparent;
    }

    /* TAGLINE */
    .tagline {
      position: absolute;
      left: var(--pad-x);
      bottom: clamp(40px, 7.5vh, 70px);
      font-size: clamp(24px, 2.65vw, 44px);
      line-height: 1.2;
      font-weight: 300;
      letter-spacing: -0.01em;
      color: var(--fg);
      transition: color 0.3s;
    }

    .tagline strong {
      font-weight: 700;
      display: block;
    }

    /* CTA ROW */
    .cta-row {
      position: absolute;
      left: 45.6%;
      right: -1vw;
      top: 88.7%;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
    }

    .cta {
      flex: none;
      padding: 0 18px;
      height: 48px;
      display: inline-flex;
      align-items: center;
      border: 1.5px solid var(--border-line);
      border-radius: 6px;
      background: var(--card-bg);
      color: var(--fg);
      font-size: 14px;
      font-weight: 400;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.25s, color 0.25s, border-color 0.3s;
    }

    .cta:hover {
      background: var(--fg);
      color: var(--bg);
    }

    .cta-line {
      flex: 1;
      height: 1.5px;
      background: var(--border-line);
      min-width: 40px;
      transition: background-color 0.3s;
    }

    .count {
      flex: none;
      font-size: clamp(140px, 19.8vw, 360px);
      font-weight: 400;
      line-height: 1;
      letter-spacing: -0.02em;
      color: transparent;
      -webkit-text-stroke: 1.5px var(--border-line);
      transform: translateY(6%);
      user-select: none;
      transition: -webkit-text-stroke-color 0.3s;
    }

    /* LOADER */
    .loader {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 12px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--fg);
      opacity: 0.6;
      transition: opacity 0.6s ease;
      font-weight: 600;
    }

    .loader.done {
      opacity: 0;
      pointer-events: none;
    }

    /* RESPONSIVE */
    @media (max-width: 900px), (max-aspect-ratio: 1/1) {
      .arrows {
        left: auto;
        right: var(--pad-x);
        top: 15%;
        transform: translateY(-50%);
        gap: 14px;
      }
      .tagline {
        bottom: clamp(150px, 20vh, 220px);
      }
      .cta-row {
        left: var(--pad-x);
        right: -3vw;
        top: auto;
        bottom: 24px;
        transform: none;
      }
      .count {
        font-size: clamp(120px, 22vw, 200px);
      }
    }

    @media (max-width: 640px) {
      .nav-links {
        gap: 16px;
      }
      .nav-links a, .logo {
        font-size: 13px;
      }
      .dots {
        gap: 20px;
        right: 16px;
      }
      .dot {
        width: 10px;
        height: 10px;
      }
      .cta-row {
        right: -8vw;
      }
      .count {
        font-size: 120px;
      }
    }

    @media (max-width: 420px) {
      .nav-links li:nth-child(2) {
        display: none;
      }
    }
  </style>
</head>
<body>
  <section class="hero" id="hero">
    <canvas id="scene" aria-label="Rotatable glass cube. Drag to rotate."></canvas>

    <div class="ui">
      <h1 class="sr-only">Explore New Ideas</h1>

      <header class="nav">
        <a href="#" class="logo">
          <i class="logo-mark"></i>
          <b>Design</b><span>World</span>
        </a>
        <div class="nav-right">
          <ul class="nav-links">
            <li><a href="#">Home</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact Us</a></li>
          </ul>
          <button id="themeToggle" class="theme-toggle" aria-label="Toggle Bright / Dark theme">
            <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
            <span id="themeLabel">Dark</span>
          </button>
        </div>
      </header>

      <div class="arrows">
        <button class="arrow" id="prev" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M11 6l-6 6 6 6" />
          </svg>
        </button>
        <button class="arrow" id="next" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>

      <nav class="dots" aria-label="Pagination dots">
        <button class="dot" aria-label="Slide 1"></button>
        <button class="dot active" aria-label="Slide 2"></button>
        <button class="dot" aria-label="Slide 3"></button>
      </nav>

      <p class="tagline">Let's Build the<br>Future of <strong>Design.</strong></p>

      <div class="cta-row">
        <a href="#" class="cta">Explore Now</a>
        <span class="cta-line"></span>
        <span class="count" aria-hidden="true">07</span>
      </div>

      <div class="loader" id="loader">Loading model</div>
    </div>
  </section>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

    const MODEL_URL = 'https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260929_212926_92423081-b0e4-4f5a-b650-14af6c05c058.glb';

    // Theme state: Bright / Cream white by default
    let isBright = true;
    const themeToggleBtn = document.getElementById('themeToggle');
    const themeLabel = document.getElementById('themeLabel');
    const themeIcon = document.getElementById('themeIcon');
    const htmlElem = document.documentElement;

    function applyTheme(bright) {
      isBright = bright;
      if (isBright) {
        htmlElem.setAttribute('data-theme', 'light');
        themeLabel.textContent = 'Dark';
        themeIcon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
      } else {
        htmlElem.setAttribute('data-theme', 'dark');
        themeLabel.textContent = 'Bright';
        themeIcon.innerHTML = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="1" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
      }
      if (frontMat && backMat) {
        frontMat.uniforms.uIsBright.value = isBright ? 1.0 : 0.0;
        backMat.uniforms.uIsBright.value = isBright ? 1.0 : 0.0;
      }
      redrawHeadline();
    }

    themeToggleBtn.addEventListener('click', () => {
      applyTheme(!isBright);
    });

    // WebGL Canvas & Renderer
    const canvas = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({
      canvas: canvas,
      antialias: true,
      alpha: false
    });
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));

    // Cameras & Scenes
    const scene = new THREE.Scene();
    const bgScene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(30, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 10);
    camera.lookAt(0, 0, 0);

    // Offscreen Headline Canvas & Texture
    const bgCanvas = document.createElement('canvas');
    const bgCtx = bgCanvas.getContext('2d');
    const bgTexture = new THREE.CanvasTexture(bgCanvas);
    bgTexture.colorSpace = THREE.SRGBColorSpace;
    bgTexture.minFilter = THREE.LinearFilter;
    bgTexture.magFilter = THREE.LinearFilter;
    bgTexture.generateMipmaps = false;

    // Fullscreen Quad for Background
    const bgMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTex: { value: bgTexture }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = vec4(position.xy, 0.0, 1.0);
        }
      `,
      fragmentShader: `
        uniform sampler2D uTex;
        varying vec2 vUv;
        void main() {
          gl_FragColor = texture2D(uTex, vUv);
          #include <colorspace_fragment>
        }
      `,
      depthTest: false,
      depthWrite: false
    });
    const bgQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), bgMaterial);
    bgQuad.frustumCulled = false;
    bgScene.add(bgQuad);

    // Redraw Headline
    function redrawHeadline() {
      const W = window.innerWidth;
      const H = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      bgCanvas.width = Math.max(1, Math.floor(W * dpr));
      bgCanvas.height = Math.max(1, Math.floor(H * dpr));

      bgCtx.save();
      bgCtx.scale(dpr, dpr);

      // Background fill
      bgCtx.fillStyle = isBright ? '#f8f6f0' : '#000000';
      bgCtx.fillRect(0, 0, W, H);

      const mobile = (W < 768) || (W / H < 1);
      let fs = Math.min(H * 0.21, W * (mobile ? 0.21 : 0.118));
      bgCtx.font = `800 ${fs}px 'Poppins', sans-serif`;

      const lines = ['Explore', 'New', 'Ideas'];
      const maxAllowed = W * (mobile ? 0.9 : 0.5);
      let widest = 0;
      for (const line of lines) {
        widest = Math.max(widest, bgCtx.measureText(line).width);
      }
      if (widest > maxAllowed && widest > 0) {
        fs *= (maxAllowed / widest);
        bgCtx.font = `800 ${fs}px 'Poppins', sans-serif`;
      }

      bgCtx.fillStyle = isBright ? '#1a1a1a' : '#e9e9e9';
      bgCtx.textAlign = 'center';
      bgCtx.textBaseline = 'alphabetic';

      const cx = W * (mobile ? 0.5 : 0.505);
      const cy = H * (mobile ? 0.45 : 0.468);
      const gap = fs * 1.07;
      const cap = fs * 0.7;

      for (let i = 0; i < lines.length; i++) {
        const y = cy + cap / 2 + (i - 1) * gap;
        bgCtx.fillText(lines[i], cx, y);
      }

      bgCtx.restore();
      bgTexture.needsUpdate = true;
    }

    // Render Targets
    let rtBack = null;
    let rtFront = null;

    function initRenderTargets() {
      const w = Math.floor(window.innerWidth * renderer.getPixelRatio());
      const h = Math.floor(window.innerHeight * renderer.getPixelRatio());

      if (rtBack) rtBack.dispose();
      if (rtFront) rtFront.dispose();

      const options = {
        type: THREE.HalfFloatType,
        minFilter: THREE.LinearFilter,
        magFilter: THREE.LinearFilter,
        format: THREE.RGBAFormat
      };

      rtBack = new THREE.WebGLRenderTarget(w, h, options);
      rtFront = new THREE.WebGLRenderTarget(w, h, options);

      if (backMat) backMat.uniforms.uTexture.value = rtBack.texture;
      if (frontMat) frontMat.uniforms.uTexture.value = rtFront.texture;
    }

    // Custom Glass Shader Material with 6-band chromatic dispersion
    const glassVertexShader = `
      varying vec3 vNormal;
      varying vec3 vEye;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vec4 mvPos = viewMatrix * worldPos;
        gl_Position = projectionMatrix * mvPos;
        vNormal = normalize(normalMatrix * normal);
        vEye = normalize(mvPos.xyz);
      }
    `;

    const glassFragmentShader = `
      uniform sampler2D uTexture;
      uniform vec2 uResolution;
      uniform float uIorR;
      uniform float uIorY;
      uniform float uIorG;
      uniform float uIorC;
      uniform float uIorB;
      uniform float uIorP;
      uniform float uRefractPower;
      uniform float uChromatic;
      uniform float uSaturation;
      uniform float uShininess;
      uniform float uDiffuseness;
      uniform float uFresnelPower;
      uniform vec3 uLight;
      uniform float uBackside;
      uniform float uIsBright;

      varying vec3 vNormal;
      varying vec3 vEye;

      float specular(vec3 lightDir, float shininess, float diffuseness, vec3 n, vec3 eye) {
        vec3 lightVec = normalize(lightDir);
        vec3 viewVec = -eye;
        vec3 halfVec = normalize(lightVec + viewVec);
        float spec = pow(max(dot(n, halfVec), 0.0), shininess);
        float diff = max(0.0, dot(n, lightVec)) * diffuseness;
        return spec + diff;
      }

      void main() {
        vec2 uv = gl_FragCoord.xy / uResolution;
        vec3 n = normalize(vNormal);
        if (uBackside > 0.5) n = -n;
        vec3 eye = normalize(vEye);

        vec3 color = vec3(0.0);
        const int LOOP = 16;
        for (int i = 0; i < LOOP; i++) {
          float slide = float(i) / float(LOOP) * 0.045;

          vec3 refrR = refract(eye, n, 1.0 / uIorR);
          vec3 refrY = refract(eye, n, 1.0 / uIorY);
          vec3 refrG = refract(eye, n, 1.0 / uIorG);
          vec3 refrC = refract(eye, n, 1.0 / uIorC);
          vec3 refrB = refract(eye, n, 1.0 / uIorB);
          vec3 refrP = refract(eye, n, 1.0 / uIorP);

          vec2 uvR = uv + refrR.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 uvY = uv + refrY.xy * (uRefractPower + slide * 1.0) * uChromatic;
          vec2 uvG = uv + refrG.xy * (uRefractPower + slide * 2.0) * uChromatic;
          vec2 uvC = uv + refrC.xy * (uRefractPower + slide * 2.5) * uChromatic;
          vec2 uvB = uv + refrB.xy * (uRefractPower + slide * 3.0) * uChromatic;
          vec2 uvP = uv + refrP.xy * (uRefractPower + slide * 1.0) * uChromatic;

          vec4 texR = texture2D(uTexture, uvR);
          vec4 texY = texture2D(uTexture, uvY);
          vec4 texG = texture2D(uTexture, uvG);
          vec4 texC = texture2D(uTexture, uvC);
          vec4 texB = texture2D(uTexture, uvB);
          vec4 texP = texture2D(uTexture, uvP);

          float r = texR.r * 0.5;
          float y = (texY.r * 2.0 + texY.g * 2.0 - texY.b) / 6.0;
          float g = texG.g * 0.5;
          float c = (texC.g * 2.0 + texC.b * 2.0 - texC.r) / 6.0;
          float b = texB.b * 0.5;
          float p = (texP.b * 2.0 + texP.r * 2.0 - texP.g) / 6.0;

          float R = r + (2.0 * p + 2.0 * y - c) / 3.0;
          float G = g + (2.0 * y + 2.0 * c - p) / 3.0;
          float B = b + (2.0 * c + 2.0 * p - y) / 3.0;

          color += vec3(R, G, B);
        }
        color /= float(LOOP);

        // Saturation adjustment
        float luma = dot(color, vec3(0.2125, 0.7154, 0.0721));
        color = mix(vec3(luma), color, uSaturation);

        // Specular
        float spec = specular(-uLight, uShininess, uDiffuseness, n, eye) +
                     0.6 * specular(vec3(1.0, 1.0, -1.0), uShininess * 0.6, uDiffuseness * 0.5, n, eye);
        color += spec * (uBackside > 0.5 ? 0.35 : 1.0);

        // Fresnel
        float f = pow(1.0 + dot(eye, n), uFresnelPower);
        vec3 fresnelCol = (uIsBright > 0.5) ? vec3(1.0, 0.98, 0.94) : vec3(1.0);
        color = mix(color, fresnelCol, f * (uBackside > 0.5 ? 0.25 : 0.55));

        // Subtle ambient lift
        color += (uIsBright > 0.5) ? vec3(0.015, 0.014, 0.012) : vec3(0.004, 0.005, 0.007);

        gl_FragColor = vec4(color, 1.0);
        #include <colorspace_fragment>
      }
    `;

    function createGlassMaterial(backside) {
      return new THREE.ShaderMaterial({
        vertexShader: glassVertexShader,
        fragmentShader: glassFragmentShader,
        side: backside ? THREE.BackSide : THREE.FrontSide,
        uniforms: {
          uTexture: { value: null },
          uResolution: { value: new THREE.Vector2() },
          uIorR: { value: 1.15 },
          uIorY: { value: 1.16 },
          uIorG: { value: 1.18 },
          uIorC: { value: 1.22 },
          uIorB: { value: 1.22 },
          uIorP: { value: 1.22 },
          uRefractPower: { value: backside ? 0.22 : 0.30 },
          uChromatic: { value: 0.5 },
          uSaturation: { value: 1.08 },
          uShininess: { value: 90.0 },
          uDiffuseness: { value: 0.02 },
          uFresnelPower: { value: 5.0 },
          uLight: { value: new THREE.Vector3(-1, 1, 1).normalize() },
          uBackside: { value: backside ? 1.0 : 0.0 },
          uIsBright: { value: isBright ? 1.0 : 0.0 }
        }
      });
    }

    const backMat = createGlassMaterial(true);
    const frontMat = createGlassMaterial(false);

    // Scene Graph: scene -> pivot -> spinner -> cubeMesh
    const pivot = new THREE.Group();
    const spinner = new THREE.Group();
    pivot.add(spinner);
    scene.add(pivot);

    let cubeMesh = null;

    // Load Model or fallback
    const loaderElem = document.getElementById('loader');

    function setupGeometry(geom) {
      geom.center();
      geom.computeBoundingBox();
      const bbox = geom.boundingBox;
      const size = new THREE.Vector3();
      bbox.getSize(size);
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        geom.scale(1 / maxDim, 1 / maxDim, 1 / maxDim);
      }
      cubeMesh = new THREE.Mesh(geom, frontMat);
      spinner.add(cubeMesh);
      loaderElem.classList.add('done');
      layout();
    }

    const gltfLoader = new GLTFLoader();
    gltfLoader.load(
      MODEL_URL,
      (gltf) => {
        try {
          const parts = [];
          gltf.scene.updateMatrixWorld(true);
          gltf.scene.traverse((node) => {
            if (node.isMesh && node.geometry) {
              const g = node.geometry.clone();
              g.deleteAttribute('uv');
              g.deleteAttribute('color');
              g.deleteAttribute('tangent');
              const merged = mergeVertices(g, 1e-4);
              merged.computeVertexNormals();
              merged.applyMatrix4(node.matrixWorld);
              parts.push(merged);
            }
          });
          if (parts.length > 0) {
            const finalGeom = mergeGeometries(parts, false);
            setupGeometry(finalGeom);
          } else {
            fallbackGeometry();
          }
        } catch (e) {
          console.warn('Model process error, using fallback:', e);
          fallbackGeometry();
        }
      },
      undefined,
      (err) => {
        console.warn('GLTF load failed, using fallback RoundedBoxGeometry:', err);
        fallbackGeometry();
      }
    );

    function fallbackGeometry() {
      const geom = new RoundedBoxGeometry(1, 1, 1, 8, 0.12);
      setupGeometry(geom);
    }

    // Layout
    function layout() {
      const W = window.innerWidth;
      const H = window.innerHeight;

      renderer.setSize(W, H, false);
      const dpr = renderer.getPixelRatio();
      const dw = Math.floor(W * dpr);
      const dh = Math.floor(H * dpr);

      camera.aspect = W / H;
      camera.updateProjectionMatrix();

      frontMat.uniforms.uResolution.value.set(dw, dh);
      backMat.uniforms.uResolution.value.set(dw, dh);

      initRenderTargets();
      redrawHeadline();

      // Cube placement
      const mobile = (W < 768) || (W / H < 1);
      const fovRad = THREE.MathUtils.degToRad(camera.fov);
      const visH = 2 * Math.tan(fovRad / 2) * 10;
      const visW = visH * camera.aspect;

      const sx = mobile ? 0.5 : 0.517;
      const sy = mobile ? 0.45 : 0.488;
      pivot.position.set((sx - 0.5) * visW, (0.5 - sy) * visH, 0);

      const px = Math.min(H * 0.44, W * (mobile ? 0.45 : 0.29));
      const s = (px / H) * visH;
      pivot.scale.set(s, s, s);
    }

    // Initial spinner rotation
    spinner.rotation.set(-0.42, 0.62, 0.18);

    // Interaction & Animation
    let isDragging = false;
    let prevPointerX = 0;
    let prevPointerY = 0;
    let velX = 0;
    let velY = 0;
    let targetTurnRemaining = 0;
    let timeSinceDrag = 10.0;

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      canvas.setPointerCapture(e.pointerId);
      prevPointerX = e.clientX;
      prevPointerY = e.clientY;
      velX = 0;
      velY = 0;
      targetTurnRemaining = 0;
      timeSinceDrag = 0;
      canvas.classList.add('dragging');
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - prevPointerX) * 0.008;
      const dy = (e.clientY - prevPointerY) * 0.008;

      velX = dx;
      velY = dy;
      prevPointerX = e.clientX;
      prevPointerY = e.clientY;

      rotateWorld(dx, dy);
    });

    function endDrag(e) {
      if (!isDragging) return;
      isDragging = false;
      try {
        canvas.releasePointerCapture(e.pointerId);
      } catch (err) {}
      canvas.classList.remove('dragging');
      timeSinceDrag = 0;
    }

    canvas.addEventListener('pointerup', endDrag);
    canvas.addEventListener('pointercancel', endDrag);

    function rotateWorld(dx, dy) {
      const qY = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 1, 0), dx);
      const qX = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(1, 0, 0), dy);
      spinner.quaternion.premultiply(qY);
      spinner.quaternion.premultiply(qX);
    }

    // Prev / Next Arrows
    const prevBtn = document.getElementById('prev');
    const nextBtn = document.getElementById('next');

    prevBtn.addEventListener('click', () => {
      velX = 0;
      velY = 0;
      targetTurnRemaining -= Math.PI / 2;
      timeSinceDrag = 0;
    });

    nextBtn.addEventListener('click', () => {
      velX = 0;
      velY = 0;
      targetTurnRemaining += Math.PI / 2;
      timeSinceDrag = 0;
    });

    // Pagination Dots
    const dots = document.querySelectorAll('.dot');
    dots.forEach((dot) => {
      dot.addEventListener('click', () => {
        dots.forEach((d) => d.classList.remove('active'));
        dot.classList.add('active');
      });
    });

    // Fonts ready & initialization
    Promise.race([
      Promise.all([
        document.fonts.load("800 100px 'Poppins'"),
        document.fonts.ready
      ]),
      new Promise((resolve) => setTimeout(resolve, 2500))
    ]).then(() => {
      layout();
    });

    document.fonts.addEventListener('loadingdone', () => {
      redrawHeadline();
    });

    window.addEventListener('resize', layout);

    // Main Animation Loop
    let lastTime = performance.now();

    function animate(now) {
      requestAnimationFrame(animate);

      let dt = (now - lastTime) / 1000;
      lastTime = now;
      if (dt > 0.05) dt = 0.05;

      if (!isDragging) {
        timeSinceDrag += dt;

        // Button Turn Animation
        if (Math.abs(targetTurnRemaining) > 0.0005) {
          const step = targetTurnRemaining * Math.min(1.0, 0.09 * dt * 60);
          rotateWorld(step, 0);
          targetTurnRemaining -= step;
        } else {
          targetTurnRemaining = 0;
        }

        // Inertia
        if (Math.abs(velX) > 1e-5 || Math.abs(velY) > 1e-5) {
          rotateWorld(velX, velY);
          const damping = Math.pow(0.94, dt * 60);
          velX *= damping;
          velY *= damping;
        }

        // Idle Drift
        if (timeSinceDrag > 0.6) {
          const blend = Math.min(1.0, (timeSinceDrag - 0.6) / 1.0);
          const driftY = 0.0035 * (dt * 60) * blend;
          const driftX = 0.0012 * (dt * 60) * blend;
          rotateWorld(driftY, driftX);
        }
      }

      // Render Pipeline
      if (cubeMesh && rtBack && rtFront) {
        // 1) Render bgScene -> rtBack
        renderer.setRenderTarget(rtBack);
        renderer.render(bgScene, camera);

        // 2) Render bgScene -> rtFront, then cube with backMat -> rtFront
        renderer.setRenderTarget(rtFront);
        renderer.render(bgScene, camera);
        renderer.autoClear = false;
        cubeMesh.material = backMat;
        renderer.render(scene, camera);

        // 3) Render bgScene -> screen, then cube with frontMat -> screen
        renderer.setRenderTarget(null);
        renderer.autoClear = true;
        renderer.render(bgScene, camera);

        renderer.autoClear = false;
        renderer.clearDepth();
        cubeMesh.material = frontMat;
        renderer.render(scene, camera);
      } else {
        renderer.setRenderTarget(null);
        renderer.render(bgScene, camera);
      }
    }

    requestAnimationFrame(animate);
  </script>
</body>
</html>
